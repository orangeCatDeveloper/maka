# Six runs at two and three workers all passed, which sizes the win (-46% at
# three) but says little about a focus race that fails probabilistically. This
# is the flakiness sample: shards spread the rounds across separate runners so
# machine variance is sampled too, and every shard carries a one-worker control
# so a failure that is simply flaky is not read as caused by parallelism.
name: Desktop e2e worker soak

on:
  push:
    branches: [ci/e2e-workers-soak]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soak:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: sudo apt-get update && sudo apt-get install -y ripgrep bubblewrap xvfb

      - run: npm ci

      - run: npm run build

      - name: Soak
        working-directory: apps/desktop
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p /tmp/e2e-logs
          echo "availableParallelism=$(node -p 'require("os").availableParallelism()')"
          # retries stay at 0, so a focus race surfaces as a failure here rather
          # than being papered over by a rerun.
          run_workers() {
            local n="$1" round="$2"
            local log="/tmp/e2e-logs/s$SHARD-workers-$n-r$round.log"
            local start=$SECONDS status=ok
            xvfb-run -a npm exec -- playwright test --config e2e/playwright.config.ts \
              --workers="$n" --reporter=list > "$log" 2>&1 || status=FAILED
            echo "s$SHARD,workers=$n,r$round,$((SECONDS - start)),$status" >> /tmp/e2e-results.csv
            echo "shard $SHARD workers=$n r$round: $((SECONDS - start))s $status"
          }
          run_workers 1 control
          for round in 1 2 3 4 5; do run_workers 3 "$round"; done

      - name: Report
        if: always()
        run: |
          {
            echo "### shard ${{ matrix.shard }}"
            echo '| shard | workers | round | seconds | result |'
            echo '| --- | --- | --- | --- | --- |'
            sed 's/,/ | /g; s/^/| /; s/$/ |/' /tmp/e2e-results.csv
          } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/e2e-results.csv
          echo "--- failures, if any"
          grep -c FAILED /tmp/e2e-results.csv || true
          for log in /tmp/e2e-logs/*.log; do
            grep -qE '^\s+[0-9]+ passed' "$log" && continue
            echo "=== $log"
            tail -40 "$log"
          done

      - name: Upload soak logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soak-logs-${{ matrix.shard }}
          path: /tmp/e2e-logs
